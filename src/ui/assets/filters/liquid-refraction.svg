<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Static backdrop displacement: at most +/-1.5 CSS px per axis before M6 stretch. -->
    <filter
      id="tool-lens-refraction"
      x="-20%"
      y="-20%"
      width="140%"
      height="140%"
      filterUnits="objectBoundingBox"
      primitiveUnits="userSpaceOnUse"
      color-interpolation-filters="sRGB"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.018 0.022"
        numOctaves="1"
        seed="7"
        result="refraction-map"
      />
      <feDisplacementMap
        in="SourceGraphic"
        in2="refraction-map"
        scale="3"
        xChannelSelector="R"
        yChannelSelector="G"
      />
    </filter>
    <!-- Static Dock displacement: at most +/-0.5 CSS px per axis. -->
    <filter
      id="tool-dock-refraction"
      x="-20%"
      y="-20%"
      width="140%"
      height="140%"
      filterUnits="objectBoundingBox"
      primitiveUnits="userSpaceOnUse"
      color-interpolation-filters="sRGB"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.018 0.022"
        numOctaves="1"
        seed="7"
        result="tool-dock-refraction-map"
      />
      <feDisplacementMap
        in="SourceGraphic"
        in2="tool-dock-refraction-map"
        scale="1"
        xChannelSelector="R"
        yChannelSelector="G"
      />
    </filter>
    <!-- Static Preview displacement: at most +/-0.25 CSS px per axis. -->
    <filter
      id="route-preview-refraction"
      x="-20%"
      y="-20%"
      width="140%"
      height="140%"
      filterUnits="objectBoundingBox"
      primitiveUnits="userSpaceOnUse"
      color-interpolation-filters="sRGB"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.018 0.022"
        numOctaves="1"
        seed="7"
        result="route-preview-refraction-map"
      />
      <feDisplacementMap
        in="SourceGraphic"
        in2="route-preview-refraction-map"
        scale="0.5"
        xChannelSelector="R"
        yChannelSelector="G"
      />
    </filter>
  </defs>
</svg>
